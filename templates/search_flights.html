<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Search Flights - FlightBook</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #222;
        }

        .search-page {
            min-height: calc(100vh - 70px);
            padding: 60px 20px;
            background:
                linear-gradient(
                    rgba(11, 31, 58, 0.85),
                    rgba(11, 31, 58, 0.75)
                ),
                url("https://images.unsplash.com/photo-1436491865332-7a61a109cc05?auto=format&fit=crop&w=2000&q=80");

            background-size: cover;
            background-position: center;
        }

        .heading {
            text-align: center;
            color: white;
            margin-bottom: 35px;
        }

        .heading h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .heading p {
            font-size: 18px;
            opacity: 0.9;
        }

        .search-card {
            max-width: 1050px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.2);
        }

        .trip-type {
            display: flex;
            gap: 25px;
            margin-bottom: 28px;
            font-size: 17px;
            font-weight: bold;
        }

        .trip-type label {
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: bold;
            color: #0b1f3a;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            height: 52px;
            padding: 0 15px;
            border: 1px solid #d2d7de;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #1677c8;
            box-shadow: 0 0 0 2px rgba(22,119,200,0.12);
        }

        .search-btn {
            grid-column: 1 / -1;
            height: 55px;
            border: none;
            border-radius: 8px;
            background: #1677c8;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .search-btn:hover {
            background: #0b5fa5;
        }

        .info-section {
            max-width: 1050px;
            margin: 35px auto 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .info-card {
            background: rgba(255,255,255,0.95);
            padding: 22px;
            border-radius: 12px;
            text-align: center;
        }

        .info-card .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .info-card h3 {
            color: #0b1f3a;
            margin-bottom: 7px;
        }

        .info-card p {
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .info-section {
                grid-template-columns: 1fr;
            }

            .heading h1 {
                font-size: 32px;
            }

        }

    </style>

</head>


<body>


    {% include 'navbar.html' %}


    <section class="search-page">


        <div class="heading">

            <h1>Search Flights</h1>

            <p>
                Find the perfect flight for your journey
            </p>

        </div>


        <div class="search-card">


            <form
                method="GET"
                action="{% url 'search_flights' %}"
            >


                <div class="trip-type">

                    <label>
                        <input
                            type="radio"
                            name="trip_type"
                            value="round"
                            checked
                        >
                        Round Trip
                    </label>


                    <label>
                        <input
                            type="radio"
                            name="trip_type"
                            value="oneway"
                        >
                        One Way
                    </label>

                </div>


                <div class="form-grid">


                    <!-- FROM -->

                    <div class="form-group">

                        <label for="from">
                            FROM
                        </label>

                        <input
                            type="text"
                            id="from"
                            name="from"
                            placeholder="Departure city"
                            required
                        >

                    </div>


                    <!-- TO -->

                    <div class="form-group">

                        <label for="to">
                            TO
                        </label>

                        <input
                            type="text"
                            id="to"
                            name="to"
                            placeholder="Destination city"
                            required
                        >

                    </div>


                    <!-- DEPARTURE -->

                    <div class="form-group">

                        <label for="departure">
                            DEPARTURE
                        </label>

                        <input
                            type="date"
                            id="departure"
                            name="departure"
                            required
                        >

                    </div>


                    <!-- RETURN -->

                    <div class="form-group">

                        <label for="return">
                            RETURN
                        </label>

                        <input
                            type="date"
                            id="return"
                            name="return"
                        >

                    </div>


                    <!-- PASSENGERS -->

                    <div class="form-group">

                        <label for="passengers">
                            PASSENGERS
                        </label>

                        <select
                            id="passengers"
                            name="passengers"
                        >

                            <option value="1">
                                1 Passenger
                            </option>

                            <option value="2">
                                2 Passengers
                            </option>

                            <option value="3">
                                3 Passengers
                            </option>

                            <option value="4">
                                4 Passengers
                            </option>

                            <option value="5">
                                5 Passengers
                            </option>

                            <option value="6">
                                6 Passengers
                            </option>

                        </select>

                    </div>


                    <!-- CLASS -->

                    <div class="form-group">

                        <label for="class">
                            CLASS
                        </label>

                        <select
                            id="class"
                            name="class"
                            required
                        >

                            <option value="Economy">
                                Economy
                            </option>

                            <option value="Premium Economy">
                                Premium Economy
                            </option>

                            <option value="Business">
                                Business
                            </option>

                        </select>

                    </div>


                    <!-- SEARCH -->

                    <button
                        type="submit"
                        class="search-btn"
                    >
                        🔍 Search Flights
                    </button>


                </div>

            </form>


        </div>


        <div class="info-section">


            <div class="info-card">

                <div class="icon">
                    ✈️
                </div>

                <h3>
                    Easy Booking
                </h3>

                <p>
                    Find and book your flights in just a few clicks.
                </p>

            </div>


            <div class="info-card">

                <div class="icon">
                    💰
                </div>

                <h3>
                    Best Prices
                </h3>

                <p>
                    Compare available flights and choose what suits you.
                </p>

            </div>


            <div class="info-card">

                <div class="icon">
                    🔒
                </div>

                <h3>
                    Secure Booking
                </h3>

                <p>
                    Your booking information is securely managed.
                </p>

            </div>


        </div>


    </section>


    <script>

        const tripTypes =
            document.querySelectorAll(
                'input[name="trip_type"]'
            );

        const returnInput =
            document.getElementById("return");


        tripTypes.forEach(function(radio) {

            radio.addEventListener("change", function() {

                if (this.value === "oneway") {

                    returnInput.disabled = true;
                    returnInput.value = "";

                } else {

                    returnInput.disabled = false;

                }

            });

        });

    </script>


</body>

</html>
